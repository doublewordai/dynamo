name: stickiness
seed: 11
duration_seconds: 150
block_size: 16

# Two hosted workers and a long-prompt workload: follow-up turns should reuse the prefix and
# their worker rather than bounce between the two.
arrival_rate:
  - { time: 0, rate: 0.6 }
  - { time: 150, rate: 0.6 }

hosted:
  - id: 0
    capacity_blocks: 1600
    prefill_tokens_per_second: 200000
    decode_tokens_per_second: 60
    max_concurrent_requests: 16
    batching_slowdown: 0.08
  - id: 1
    capacity_blocks: 1600
    prefill_tokens_per_second: 200000
    decode_tokens_per_second: 60
    max_concurrent_requests: 16
    batching_slowdown: 0.08

proxies:
  - tier: X
    dp_rank_start: 1000
    workers: 2
    ttft_seconds: 0.25
    ttft_jitter: 0.2
    decode_tokens_per_second: 50
    decode_jitter: 0.2
    cache_ttl_seconds: 120
  - tier: Y
    dp_rank_start: 2000
    workers: 2
    ttft_seconds: 0.6
    ttft_jitter: 0.2
    decode_tokens_per_second: 30
    decode_jitter: 0.2
    cache_ttl_seconds: 120

workload:
  system_prompt_tokens: 128
  user_tokens: { min: 64, max: 160 }
  output_tokens: { min: 96, max: 224 }
  think_time_seconds: { min: 0.3, max: 1.2 }
  turns_per_session: { min: 4, max: 6 }

policy:
  model: test-model
  occupancy_threshold: 0.8
  hosted_capacity_blocks: 1600
  failover_penalty_blocks: 500
  pending_weight_blocks: 4
  tiers:
    - { name: X, dp_ranks: [1000, 1999], penalty_blocks: 1200, weight_blocks: 300 }
    - { name: Y, dp_ranks: [2000, 2999], penalty_blocks: 1200, weight_blocks: 700 }

assertions:
  class_stickiness_min: 0.98
  worker_stickiness_vs_default_min_delta: -0.02
  proxy_share_max_when_hosted_under_threshold: 0.01
  failures_max: 0
