name: hosted_outage
seed: 9
duration_seconds: 150
block_size: 16

# Hosted workers disappear for 40 seconds; the proxy tiers must absorb every request, and hosted
# traffic must return when the workers come back.
arrival_rate:
  - { time: 0, rate: 0.8 }
  - { time: 150, rate: 0.8 }

hosted_online:
  - { time: 0, online: true }
  - { time: 40, online: false }
  - { time: 80, online: true }

hosted:
  - id: 0
    capacity_blocks: 1600
    prefill_tokens_per_second: 200000
    decode_tokens_per_second: 60
    max_concurrent_requests: 24
    batching_slowdown: 0.08

proxies:
  - tier: X
    dp_rank_start: 1000
    workers: 4
    ttft_seconds: 0.25
    ttft_jitter: 0.2
    decode_tokens_per_second: 50
    decode_jitter: 0.2
    cache_ttl_seconds: 120
  - tier: Y
    dp_rank_start: 2000
    workers: 4
    ttft_seconds: 0.6
    ttft_jitter: 0.2
    decode_tokens_per_second: 30
    decode_jitter: 0.2
    cache_ttl_seconds: 120

workload:
  system_prompt_tokens: 64
  user_tokens: { min: 48, max: 160 }
  output_tokens: { min: 64, max: 192 }
  think_time_seconds: { min: 0.5, max: 2.0 }
  turns_per_session: { min: 1, max: 4 }

policy:
  model: test-model
  occupancy_threshold: 0.8
  hosted_capacity_blocks: 1600
  failover_penalty_blocks: 500
  pending_weight_blocks: 4
  tiers:
    - { name: X, dp_ranks: [1000, 1999], penalty_blocks: 1200, weight_blocks: 300 }
    - { name: Y, dp_ranks: [2000, 2999], penalty_blocks: 1200, weight_blocks: 700 }

phases:
  - { name: outage, start: 45, end: 75 }
  - { name: recovered, start: 90, end: 150 }

assertions:
  failures_max: 0
  phases:
    outage:
      proxy_share_min: 0.99
    recovered:
      hosted_share_min: 0.9
