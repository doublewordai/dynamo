name: proxy_rate_limited
seed: 3
duration_seconds: 150
block_size: 16

# X is cheap but capped at two concurrent requests; when it is full the router must retry on Y
# instead of failing the request.
arrival_rate:
  - { time: 0, rate: 1.0 }
  - { time: 60, rate: 5.0 }
  - { time: 120, rate: 5.0 }
  - { time: 150, rate: 1.0 }

primary:
  - id: 0
    capacity_blocks: 1600
    prefill_tokens_per_second: 200000
    decode_tokens_per_second: 60
    max_concurrent_requests: 64
    batching_slowdown: 0.08

proxies:
  - tier: X
    dp_rank_start: 1000
    workers: 2
    ttft_seconds: 0.25
    ttft_jitter: 0.2
    decode_tokens_per_second: 50
    decode_jitter: 0.2
    concurrency_limit: 2
    cache_ttl_seconds: 120
  - tier: Y
    dp_rank_start: 2000
    workers: 4
    ttft_seconds: 0.6
    ttft_jitter: 0.2
    decode_tokens_per_second: 30
    decode_jitter: 0.2
    cache_ttl_seconds: 120

workload:
  system_prompt_tokens: 64
  user_tokens: { min: 48, max: 160 }
  output_tokens: { min: 64, max: 192 }
  think_time_seconds: { min: 0.5, max: 2.0 }
  turns_per_session: { min: 1, max: 4 }

policy:
  model: test-model
  occupancy_threshold: 0.8
  failover_penalty_blocks: 500
  pending_weight_blocks: 4
  tiers:
    - { name: X, dp_ranks: [1000, 1999], penalty_blocks: 1200, weight_blocks: 300 }
    - { name: Y, dp_ranks: [2000, 2999], penalty_blocks: 1200, weight_blocks: 700 }

phases:
  - { name: limited, start: 60, end: 120 }

assertions:
  failures_max: 0
  tier_share_min:
    Y: 0.2
  phases:
    limited:
      proxy_share_min: 0.5
