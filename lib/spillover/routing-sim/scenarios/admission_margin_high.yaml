name: admission_margin_high
seed: 5
duration_seconds: 90
block_size: 16

# Twin of `admission_margin_low`. Identical environment, workload and policy; the only change
# is the hosted admission margin. At 1000000 requests the margin is far above any queue this
# workload can build, so no hosted worker is ever steered away and the policy decides
# unassisted. This is the "margin above the failover point" arm of the comparison: the same
# sessions, with the same cached prefixes, stay on hosted instead of being pushed to a proxy
# by the gate. The Rust test `margin_above_failover_keeps_more_on_hosted` asserts the arm
# keeps strictly more cached conversations on hosted and records no steering exclusions.
arrival_rate:
  - { time: 0, rate: 0.5 }
  - { time: 10, rate: 2.0 }
  - { time: 90, rate: 2.0 }

hosted:
  - id: 0
    capacity_blocks: 400
    prefill_tokens_per_second: 200000
    decode_tokens_per_second: 60
    max_concurrent_requests: 4
    batching_slowdown: 0.1
  - id: 1
    capacity_blocks: 400
    prefill_tokens_per_second: 200000
    decode_tokens_per_second: 60
    max_concurrent_requests: 4
    batching_slowdown: 0.1

proxies:
  - tier: X
    dp_rank_start: 1000
    workers: 2
    ttft_seconds: 0.25
    ttft_jitter: 0.2
    decode_tokens_per_second: 50
    decode_jitter: 0.2
    cache_ttl_seconds: 120
  - tier: Y
    dp_rank_start: 2000
    workers: 2
    ttft_seconds: 0.6
    ttft_jitter: 0.2
    decode_tokens_per_second: 30
    decode_jitter: 0.2
    cache_ttl_seconds: 120

workload:
  system_prompt_tokens: 128
  user_tokens: { min: 48, max: 160 }
  output_tokens: { min: 96, max: 160 }
  think_time_seconds: { min: 0.5, max: 2.0 }
  turns_per_session: { min: 2, max: 5 }

policy:
  model: test-model@interactive
  occupancy_threshold: 0.8
  hosted_capacity_blocks: 400
  failover_penalty_blocks: 500
  pending_weight_blocks: 4
  tiers:
    - { name: X, dp_ranks: [1000, 1999], penalty_blocks: 1200, weight_blocks: 300 }
    - { name: Y, dp_ranks: [2000, 2999], penalty_blocks: 1200, weight_blocks: 700 }

admission:
  hosted_queue_margin: 1000000

assertions:
  failures_max: 0
  admission_529_max: 0
  # The high margin must never steer away from hosted.
  steering_exclusions_max: 0
