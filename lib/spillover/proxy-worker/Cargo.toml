[package]
name = "dw-proxy-worker"
description = "Dynamo worker that looks like SGLang to the router and serves requests from a third-party provider"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dw-proxy-worker"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
dw-proxy-core = { path = "../proxy-core" }
dynamo-kv-router = { workspace = true }
dynamo-llm = { workspace = true }
dynamo-runtime = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokenizers = { version = "0.21.4", default-features = false, features = ["onig"] }
tokio = { workspace = true }
tracing = { workspace = true }

dynamo-backend-common = { workspace = true }
prometheus = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4", features = ["derive"] }
