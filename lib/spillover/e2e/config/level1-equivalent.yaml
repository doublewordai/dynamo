# Level 1 twin of the Level 2 run: two hosted workers and one proxy per tier,
# with the same DP ranks, tier preference and ramp as config/arrival-profile.json.
# `routing-sim` drives the real dw-spillover policy through virtual time, so its
# report can be compared with lib/spillover/e2e/report.py --baseline. Tier names match the
# e2e report's class names (proxy-x, proxy-y) so the comparison is by-name.
#
# Hosted throughput is fitted to the mocker's observed latency in the e2e run
# (p50 ~2.5 s, TTFT ~1.4 s for ~32 output tokens) so the comparison isolates
# routing from backend speed. The proxies use the fake provider's real 200 tps.
name: e2e_equivalent
seed: 7
duration_seconds: 60
block_size: 64

# Same shape as config/arrival-profile.json: ramp up past hosted capacity, then down.
arrival_rate:
  - { time: 0, rate: 1.0 }
  - { time: 15, rate: 3.0 }
  - { time: 40, rate: 5.0 }
  - { time: 60, rate: 0.5 }

hosted:
  - id: 0
    capacity_blocks: 8
    prefill_tokens_per_second: 500
    decode_tokens_per_second: 30
    max_concurrent_requests: 64
    batching_slowdown: 0.05
  - id: 1
    capacity_blocks: 8
    prefill_tokens_per_second: 500
    decode_tokens_per_second: 30
    max_concurrent_requests: 64
    batching_slowdown: 0.05

proxies:
  - tier: proxy-x
    dp_rank_start: 1000
    workers: 1
    ttft_seconds: 0.03
    ttft_jitter: 0.1
    decode_tokens_per_second: 200
    decode_jitter: 0.1
    cache_ttl_seconds: 300
  - tier: proxy-y
    dp_rank_start: 2000
    workers: 1
    ttft_seconds: 0.03
    ttft_jitter: 0.1
    decode_tokens_per_second: 200
    decode_jitter: 0.1
    cache_ttl_seconds: 300

workload:
  system_prompt_tokens: 40
  user_tokens: { min: 20, max: 60 }
  output_tokens: { min: 32, max: 32 }
  think_time_seconds: { min: 0.5, max: 0.5 }
  turns_per_session: { min: 4, max: 4 }

policy:
  model: e2e-model
  occupancy_threshold: 0.8
  hosted_capacity_blocks: 8
  failover_penalty_blocks: 200
  pending_weight_blocks: 4
  tiers:
    - { name: proxy-x, dp_ranks: [1000, 1999], penalty_blocks: 200, weight_blocks: 8 }
    - { name: proxy-y, dp_ranks: [2000, 2999], penalty_blocks: 200, weight_blocks: 40 }

phases:
  - { name: baseline, start: 0, end: 15 }
  - { name: peak, start: 40, end: 55 }
