---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
    helm.sh/resource-policy: keep
  name: dynamomirrorpairs.nvidia.com
spec:
  group: nvidia.com
  names:
    kind: DynamoMirrorPair
    listKind: DynamoMirrorPairList
    plural: dynamomirrorpairs
    shortNames:
      - dmp
    singular: dynamomirrorpair
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.graphDeploymentName
          name: Deployment
          type: string
        - jsonPath: .spec.componentName
          name: Component
          type: string
        - jsonPath: .spec.mirror.podName
          name: Mirror
          type: string
        - jsonPath: .spec.shadowed.podName
          name: Shadowed
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            DynamoMirrorPair is one step of a mirror rollout: a new-generation worker
            that receives copies of an old-generation worker's requests until a judge
            approves it to replace that worker, or rejects it.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                DynamoMirrorPairSpec names a new-generation worker mirroring the old-generation
                worker it replaces during a mirror rollout. The operator writes it; judges
                read it to decide the verdict.
              properties:
                componentName:
                  description: ComponentName is the worker component of that deployment.
                  type: string
                firstPair:
                  description: |-
                    FirstPair is true for the first pair of this generation in this
                    component, so a judge can hold it longer than the rest.
                  type: boolean
                graphDeploymentName:
                  description: GraphDeploymentName is the DynamoGraphDeployment being rolled out.
                  type: string
                mirror:
                  description: Mirror is the new-generation worker.
                  properties:
                    dynamoNamespace:
                      description: DynamoNamespace is the Dynamo namespace the worker registers in.
                      type: string
                    podName:
                      description: PodName is the worker's Pod.
                      type: string
                    workerID:
                      description: WorkerID is the worker's Dynamo instance id, in decimal.
                      type: string
                  required:
                    - dynamoNamespace
                    - podName
                    - workerID
                  type: object
                shadowed:
                  description: Shadowed is the old-generation worker the mirror receives copies of.
                  properties:
                    dynamoNamespace:
                      description: DynamoNamespace is the Dynamo namespace the worker registers in.
                      type: string
                    podName:
                      description: PodName is the worker's Pod.
                      type: string
                    workerID:
                      description: WorkerID is the worker's Dynamo instance id, in decimal.
                      type: string
                  required:
                    - dynamoNamespace
                    - podName
                    - workerID
                  type: object
                workerHash:
                  description: WorkerHash identifies the new worker generation.
                  type: string
              required:
                - componentName
                - graphDeploymentName
                - mirror
                - shadowed
                - workerHash
              type: object
            status:
              description: DynamoMirrorPairStatus is the pair's progress and verdict.
              properties:
                conditions:
                  description: |-
                    Conditions carry the verdict. Judges set Approved or Rejected to True;
                    the first to become True decides the pair.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                mirroringSince:
                  description: MirroringSince is when the mirror started receiving copies.
                  format: date-time
                  type: string
                phase:
                  description: Phase is set by the operator.
                  type: string
                reason:
                  description: Reason explains an Aborted phase.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
