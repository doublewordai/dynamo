---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
    helm.sh/resource-policy: keep
  name: dynamomodels.nvidia.com
spec:
  group: nvidia.com
  names:
    kind: DynamoModel
    listKind: DynamoModelList
    plural: dynamomodels
    shortNames:
      - dm
    singular: dynamomodel
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: Base model name
          jsonPath: .spec.baseModelName
          name: BaseModel
          type: string
        - description: Model type
          jsonPath: .spec.modelType
          name: Type
          type: string
        - description: Ready endpoints
          jsonPath: .status.readyEndpoints
          name: Ready
          type: integer
        - description: Total endpoints
          jsonPath: .status.totalEndpoints
          name: Total
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              properties:
                baseModelName:
                  type: string
                modelName:
                  type: string
                modelType:
                  default: base
                  enum:
                    - base
                    - lora
                    - adapter
                  type: string
                source:
                  properties:
                    uri:
                      type: string
                  required:
                    - uri
                  type: object
              required:
                - baseModelName
                - modelName
              type: object
            status:
              properties:
                conditions:
                  items:
                    properties:
                      lastTransitionTime:
                        format: date-time
                        type: string
                      message:
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                endpoints:
                  items:
                    properties:
                      address:
                        type: string
                      loraFallbackCovered:
                        type: boolean
                      podName:
                        type: string
                      ready:
                        type: boolean
                    required:
                      - address
                      - ready
                    type: object
                  type: array
                loraFallbackCoveredEndpoints:
                  type: integer
                readyEndpoints:
                  type: integer
                totalEndpoints:
                  type: integer
              required:
                - readyEndpoints
                - totalEndpoints
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
