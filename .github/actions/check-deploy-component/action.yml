name: 'Check Deploy Component'
description: 'Run validation checks for a deploy component'

inputs:
  component:
    description: 'Component to check: operator or snapshot'
    required: true
  platform:
    description: 'Docker platform used for linter and tester targets'
    required: true
  builder:
    description: 'Buildx builder used for builds and compiler cache mounts'
    required: true

runs:
  using: composite
  steps:
    - name: Cache operator compiler artifacts
      if: inputs.component == 'operator'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ${{ runner.temp }}/operator-buildkit-cache
        key: operator-buildkit-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/operator/go.mod', 'deploy/operator/go.sum', 'deploy/snapshot/go.mod', 'deploy/snapshot/go.sum', 'deploy/operator/Dockerfile') }}-${{ github.sha }}
        restore-keys: |
          operator-buildkit-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/operator/go.mod', 'deploy/operator/go.sum', 'deploy/snapshot/go.mod', 'deploy/snapshot/go.sum', 'deploy/operator/Dockerfile') }}-

    # Layer exporters do not persist RUN --mount=type=cache contents. Restore
    # and extract those separately so changed source can reuse Go compilation.
    - name: Restore operator compiler cache mounts
      if: inputs.component == 'operator'
      uses: reproducible-containers/buildkit-cache-dance@5b81f4d29dc8397a7d341dba3aeecc7ec54d6361  # v3.3.0
      with:
        builder: ${{ inputs.builder }}
        cache-map: |
          {
            "${{ runner.temp }}/operator-buildkit-cache/go-build": "/root/.cache/go-build",
            "${{ runner.temp }}/operator-buildkit-cache/golangci-lint": "/root/.cache/golangci-lint"
          }
        scratch-dir: ${{ runner.temp }}/operator-cache-transfer

    - name: Linter
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
      with:
        builder: ${{ inputs.builder }}
        context: ./deploy/${{ inputs.component }}
        platforms: ${{ inputs.platform }}
        target: linter
        no-cache-filters: linter
        build-contexts: |
          snapshot=./deploy/snapshot
          operator=./deploy/operator
        cache-from: type=gha,scope=check-${{ inputs.component }}-linter
        cache-to: type=gha,scope=check-${{ inputs.component }}-linter,mode=max

    - name: Tester
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
      with:
        builder: ${{ inputs.builder }}
        context: ./deploy/${{ inputs.component }}
        platforms: ${{ inputs.platform }}
        target: tester
        no-cache-filters: tester
        build-contexts: |
          snapshot=./deploy/snapshot
          operator=./deploy/operator
          operator-chart=./deploy/helm/charts/platform/components/operator
        cache-from: type=gha,scope=check-${{ inputs.component }}-tester
        cache-to: type=gha,scope=check-${{ inputs.component }}-tester,mode=max

    - name: Set up Go
      if: ${{ inputs.component == 'operator' }}
      uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
      with:
        go-version: '1.26.6'
        cache-dependency-path: |
          deploy/operator/go.sum
          deploy/snapshot/go.sum

    - name: Set up Python
      if: ${{ inputs.component == 'operator' }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.11"

    - name: Install Python dependencies for operator checks
      if: ${{ inputs.component == 'operator' }}
      shell: bash
      working-directory: ./deploy/operator
      run: |
        python -m pip install --upgrade pip
        python -m pip install \
          "pydantic>=2,<3" \
          "black==23.1.0" \
          "pyyaml>=6.0" \
          "pytest==9.0.3" \
          "pytest-timeout==2.4.0"

    - name: Check operator generated files
      if: ${{ inputs.component == 'operator' }}
      shell: bash
      working-directory: ./deploy/operator
      run: |
        make check

    - name: Test Go/Python DGD override boundary
      if: ${{ inputs.component == 'operator' }}
      shell: bash
      env:
        DYNAMO_RUN_DGD_OVERRIDE_GO_INTEGRATION: "1"
        PYTHONPATH: ${{ github.workspace }}/components/src
      run: |
        go version
        python -m pytest \
          -c /dev/null \
          --confcutdir=components/src/dynamo/profiler/tests/integration \
          -W ignore::pytest.PytestUnknownMarkWarning \
          -o "cache_dir=${RUNNER_TEMP}/dgd-override-pytest-cache" \
          -q \
          components/src/dynamo/profiler/tests/integration/test_dgd_override_go_integration.py
