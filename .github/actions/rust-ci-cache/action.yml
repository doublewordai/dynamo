name: Rust CI cache
description: Cache compiled Rust artifacts without freezing the cache at the first lockfile build

inputs:
  scope:
    description: Separate test, clippy, and feature configurations
    required: true
  workspace:
    description: Cargo workspace containing the target directory
    default: '.'

runs:
  using: composite
  steps:
    - name: Resolve compiler cache identity
      id: compiler
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: |
        # Invoking rustc also installs the repository's pinned toolchain before
        # restoring its artifacts. Include the native compiler and CI profiles.
        fingerprint=$({
          rustc -vV
          cargo -V
          protoc --version
          cc --version
          c++ --version
          printf '%s\n' "${CARGO_PROFILE_DEV_DEBUG:-}" "${CARGO_PROFILE_TEST_DEBUG:-}" "${CARGO_INCREMENTAL:-}" "${RUSTFLAGS:-}" "${RUSTDOCFLAGS:-}"
        } | sha256sum | cut -d ' ' -f 1)
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Resolve workspace dependency identity
      id: manifests
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
      run: python3 .github/scripts/rust_ci_cache.py --workspace "$WORKSPACE" >> "$GITHUB_OUTPUT"

    - name: Cache downloaded Rust dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        # Share immutable downloads between tests and clippy. Source-only
        # changes do not rewrite these archives for every matrix scope.
        key: rust-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.manifests.outputs.fingerprint }}

    - name: Restore compiled Rust artifacts
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
          ${{ inputs.workspace }}/target
          !${{ inputs.workspace }}/target/doc
          !${{ inputs.workspace }}/target/debug/incremental
        # A source revision suffix lets successful builds refresh the snapshot.
        # Restore only compatible compilers, manifests, configuration and scope;
        # Cargo still checks fingerprints and rebuilds changed source files.
        key: rust-ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-${{ steps.compiler.outputs.fingerprint }}-${{ steps.manifests.outputs.fingerprint }}-${{ github.sha }}
        restore-keys: |
          rust-ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-${{ steps.compiler.outputs.fingerprint }}-${{ steps.manifests.outputs.fingerprint }}-

    - name: Restore timestamps of unchanged Rust inputs
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
      run: python3 .github/scripts/rust_ci_cache.py --workspace "$WORKSPACE" --restore-mtimes
