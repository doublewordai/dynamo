name: Copyright Checks

on:
  pull_request

jobs:
  copyright-checks:
      # The helm-tester image lives under the upstream repository's package
      # namespace and is not published for forks; hosted runners ship pwsh, so
      # the check runs directly on the runner.
      runs-on: ubuntu-24.04
      permissions:
        contents: read
      steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - run: pwsh .github/workflows/copyright-check.ps1
        env:
          NVBUILD_VERBOSITY: DETAILED
        timeout-minutes: 2
