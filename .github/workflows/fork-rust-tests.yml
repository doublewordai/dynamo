# Required fork regression tests. Keep this job present on every PR, including
# documentation-only changes, so branch protection always receives a result.
# The broader pre-merge workflow independently checks the full Rust workspaces.
name: fork-rust-tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: fork-rust-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fork-rust-tests:
    # External contributions retain GitHub's hosted runner/cache boundary.
    runs-on: ${{ github.repository == 'doublewordai/dynamo' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'depot-ubuntu-24.04-8' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 2

      - name: Test Rust check selection
        run: python3 -m unittest discover -s .github/scripts -p test_rust_ci_scope.py -v

      - name: Select Rust checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]] || ! git diff --quiet HEAD^1 HEAD -- \
            .github/workflows/fork-rust-tests.yml \
            .github/scripts/rust_ci_scope.py \
            .github/scripts/test_rust_ci_scope.py; then
            # Selection changes must run Rust, independently of the selector's
            # own output. Missing comparison history also takes this path.
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            # Test the candidate merge tree against its current base parent.
            python3 .github/scripts/rust_ci_scope.py >> "$GITHUB_OUTPUT"
          fi

      - name: Report documentation-only change
        if: steps.scope.outputs.rust == 'false'
        run: echo "Only documentation or baseline SBOMs changed; no Rust inputs changed."

      - name: Install protoc
        if: steps.scope.outputs.rust == 'true'
        run: |
          protoc_zip="$RUNNER_TEMP/protoc.zip"
          curl --retry 5 --retry-delay 2 -fsSL \
            https://github.com/protocolbuffers/protobuf/releases/download/v30.2/protoc-30.2-linux-x86_64.zip \
            -o "$protoc_zip"
          echo "327e9397c6fb3ea2a542513a3221334c6f76f7aa524a7d2561142b67b312a01f  $protoc_zip" | sha256sum -c -
          unzip -q "$protoc_zip" -d "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/protoc" --version

      - name: Cache Rust build
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/rust-ci-cache
        with:
          scope: fork-tests

      # Note: no repo-wide `cargo fmt --check` here — the inherited tree carries
      # pre-existing formatting debt in files unrelated to this work, which would
      # make this job red for the wrong reasons. Formatting of changed files is
      # verified locally before push.

      # Focused gate for the fork's admission, routing and frontend regressions.
      # Full workspace, feature and lint coverage remains in Pre Merge.
      # Quoted: the `::` module-filter trips the YAML parser unquoted.
      - name: Test dynamo-runtime (error)
        if: steps.scope.outputs.rust == 'true'
        run: "cargo test --locked -p dynamo-runtime --lib error::"

      - name: Test dynamo-runtime admission state
        if: steps.scope.outputs.rust == 'true'
        run: "cargo test --locked -p dynamo-runtime --lib component::admission::tests"

      - name: Test dynamo-runtime push router
        if: steps.scope.outputs.rust == 'true'
        run: "cargo test --locked -p dynamo-runtime --lib pipeline::network::egress::push_router::tests"

      - name: Test dynamo-llm http service (no default features)
        if: steps.scope.outputs.rust == 'true'
        run: "cargo test --locked -p dynamo-llm --lib --no-default-features http::service::"

      - name: Test dynamo-llm preprocessor (no default features)
        if: steps.scope.outputs.rust == 'true'
        run: "cargo test --locked -p dynamo-llm --lib --no-default-features preprocessor::"

      - name: Test dynamo-llm chat protocols (no default features)
        if: steps.scope.outputs.rust == 'true'
        run: "cargo test --locked -p dynamo-llm --lib --no-default-features protocols::openai::chat_completions::"

      - name: Test dynamo-llm streaming tool parsers (no default features)
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --locked -p dynamo-llm --no-default-features --test test_streaming_tool_parsers

      - name: Forward-pass telemetry attribution
        if: steps.scope.outputs.rust == 'true'
        run: "cargo test --locked -p dynamo-llm --lib --no-default-features fpm_publisher::"
