# Spillover CI: the `dw-spillover` policy, proxy and routing simulation.
#
# Runs on pull requests that touch the spillover work and on `main`/`fork-base`.
# This fork's upstream CI jobs target self-hosted runner groups that do not
# exist in `doublewordai/dynamo`, so this workflow runs the spillover crates on
# GitHub-hosted runners (or the fork's depot group) instead.
#
# `dynamo-llm` is built without its default `block-manager` feature, which
# needs CUDA/NIXL and cannot build on a hosted runner. The `dw-spillover-*`
# crates only use `dynamo-kv-router`, so they build everywhere;
# `dw-proxy-worker` links `dynamo-llm` and is the one place the constraint
# bites, so it is built with `--no-default-features` (`dynamo-llm`'s own
# default features are controlled by its dependency edge, which F2 owns).
name: spillover

on:
  pull_request:
    paths:
      - 'lib/spillover/**'
      - 'lib/router-plugins/spillover/**'
      - 'lib/router-plugins/catalog/**'
      - '.github/workflows/spillover.yml'
  workflow_dispatch:
  push:
    branches: [main, fork-base]
    paths:
      - 'lib/spillover/**'
      - 'lib/router-plugins/spillover/**'
      - 'lib/router-plugins/catalog/**'

concurrency:
  group: spillover-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debuginfo triples the target dir; the test builds do not fit a hosted
  # runner's disk with it on. Incremental state is not reused across jobs.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  spillover:
    runs-on: ${{ github.repository == 'doublewordai/dynamo' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'depot-ubuntu-24.04-8' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 2

      - name: Free runner disk space
        # Hosted runners leave ~14GB free. Drop preinstalled toolchains this
        # build never uses so the test build does not die mid-link.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install protoc
        run: |
          protoc_zip="$RUNNER_TEMP/protoc.zip"
          curl --retry 5 --retry-delay 2 -fsSL \
            https://github.com/protocolbuffers/protobuf/releases/download/v30.2/protoc-30.2-linux-x86_64.zip \
            -o "$protoc_zip"
          echo "327e9397c6fb3ea2a542513a3221334c6f76f7aa524a7d2561142b67b312a01f  $protoc_zip" | sha256sum -c -
          unzip -q "$protoc_zip" -d "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/protoc" --version

      - name: Rust toolchain components
        run: rustup component add rustfmt clippy

      - name: Cache Rust build
        uses: ./.github/actions/rust-ci-cache
        with:
          scope: spillover

      - name: Formatting of the spillover crates
        run: >-
          cargo fmt
          -p dw-spillover-policy -p dw-proxy-core -p dw-proxy-worker -p dw-routing-sim
          -p dw-spillover-deploy -p dw-spillover-testkit
          -p dynamo-worker-selection-policy-catalog
          -- --check

      - name: Spillover clippy
        run: >-
          cargo clippy --locked
          -p dw-spillover-policy -p dw-proxy-core -p dw-proxy-worker -p dw-routing-sim
          -p dw-spillover-deploy -p dw-spillover-testkit
          -p dynamo-worker-selection-policy-catalog
          --all-targets -- -D warnings

      # `dw-spillover-policy` and `dw-routing-sim` use `dynamo-kv-router/bench`
      # in tests to expose the reference `DefaultWorkerSelector`.
      - name: Spillover tests
        run: >-
          cargo test --locked
          -p dw-spillover-policy -p dw-proxy-core -p dw-routing-sim
          -p dw-spillover-deploy -p dw-spillover-testkit
          -p dynamo-worker-selection-policy-catalog

      - name: Build dw-proxy-worker
        run: cargo build --locked -p dw-proxy-worker --no-default-features

      - name: Run routing-sim scenarios
        run: |
          cargo build --locked -p dw-routing-sim
          routing_sim="target/debug/routing-sim"
          status=0
          for scenario in lib/spillover/routing-sim/scenarios/*.yaml; do
            name="$(basename "$scenario" .yaml)"
            echo "## routing-sim: $name" >> "$GITHUB_STEP_SUMMARY"
            if ! "$routing_sim" "$scenario" --markdown "/tmp/$name.md"; then
              echo "**$name: assertions failed**" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
            cat "/tmp/$name.md" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
